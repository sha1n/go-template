version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Build={{.ShortCommit}} -X main.ProgramName={{.ProjectName}}
    main: ./cmd

archives:
  -
    id: main
    files:
      - README.md
      - LICENSE
      - build/completions
      - src: 'build/completions/*'
        dst: completions
        strip_parent: true

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
homebrew_casks:
  - name: "{{ .ProjectName }}"
    binaries:
      - "{{ .ProjectName }}"

    repository:
      owner: sha1n
      name: homebrew-tap

    homepage: "https://sha1n.github.io/{{ .ProjectName }}/"

    # Released binaries are neither signed nor notarized, so Gatekeeper would
    # otherwise refuse to run them. GoReleaser cannot yet emit the
    # `postflight_steps` stanza that Homebrew requires in place of the
    # deprecated `postflight`, so declare it through `custom_block`. The
    # Homebrew `{{staged_path}}` token is escaped from GoReleaser templating.
    # With `hooks.post.install_steps` (goreleaser/goreleaser#6873), use
    # `{{ .StagedPath }}`: hooks are templated twice and lose the escape.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/{{ .ProjectName }}"]
        end
      end
