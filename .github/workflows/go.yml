name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    permissions:
      contents: read
      # Required by the tokenless (OIDC) Codecov upload.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Linux + Windows only. macOS is intentionally excluded (cost) and is
        # verified manually on dev machines. Do NOT add macOS.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Cross-platform Go checks on every OS. Includes the bootstrap
      # scaffolding-on-a-copy integration test. Pinned to bash (available on the
      # Windows runner) so the command parses identically on every leg. No coverage
      # flags here; Linux generates coverage via `make coverage` below.
      - name: Test
        shell: bash
        run: go test ./...

      # The Unix-oriented make pipeline runs on Linux only (windows-latest
      # cannot run the bash/cp-based Makefile). `make lint` runs golangci-lint
      # (pinned via the `tool` directives in go.mod), which gates merges on the
      # complexity thresholds in .golangci.yml. `make coverage` generates the
      # coverage.out file for Codecov upload.
      - name: Lint, coverage, and build (make)
        if: matrix.os == 'ubuntu-latest'
        run: |
          make install
          make lint
          make coverage
          make build

      # Coverage uploaded from a single leg to avoid double-submission.
      # Tokenless OIDC upload; fail_ci_if_error stays off so a repo that has
      # not activated Codecov yet still gets green CI.
      - name: Coverage (Codecov)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          use_oidc: true
          fail_ci_if_error: false

  # Standalone so a complexity-threshold breach shows as its own red check,
  # in parallel with the lint/test matrix. Thresholds live in .golangci.yml
  # and are also enforced by `make lint`.
  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Complexity gate
        run: make complexity
